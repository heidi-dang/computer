name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend verification
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore production frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: cptr/frontend/build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest ruff==0.15.16

      - name: Ruff
        run: python -m ruff check cptr tests

      - name: Diff integrity
        run: git diff --check HEAD^ HEAD

      - name: Python suite
        run: python -m pytest -q

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cptr/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix cptr/frontend

      - name: Clean production build
        run: npm --prefix cptr/frontend run build:clean

      - name: Publish production frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: cptr/frontend/build
          if-no-files-found: error
          retention-days: 1
