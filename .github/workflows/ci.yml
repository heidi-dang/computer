name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend verification (Python ${{ matrix.python-version }})
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2

      - name: Restore production frontend build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frontend-build
          path: cptr/frontend/build

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install frozen backend environment
        run: |
          python -m pip install --disable-pip-version-check uv==0.12.10
          uv sync --frozen --all-extras --group dev --python python

      - name: Ruff
        run: uv run --frozen python -m ruff check cptr tests

      - name: Diff integrity
        run: git diff --check HEAD^ HEAD

      - name: Initialize isolated CPTR database
        env:
          CPTR_DATA_DIR: ${{ runner.temp }}/cptr-ci-${{ matrix.python-version }}
        run: uv run --frozen python -c "import asyncio; from cptr.utils.db import init_db; asyncio.run(init_db())"

      - name: Python suite
        env:
          CPTR_DATA_DIR: ${{ runner.temp }}/cptr-ci-${{ matrix.python-version }}
        run: uv run --frozen python -m pytest -q

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cptr/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix cptr/frontend

      - name: Clean production build
        run: npm --prefix cptr/frontend run build:clean

      - name: Publish production frontend build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-build
          path: cptr/frontend/build
          if-no-files-found: error
          retention-days: 1
