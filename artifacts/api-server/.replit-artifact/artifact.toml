kind = "api"
previewPath = "/api"
title = "Computer Runtime"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api", "/v1", "/socket.io"]

[services.development]
run = "bash replit-cptr-api.sh"

[services.production]

[services.production.build]
args = ["bash", "-lc", "true"]

[services.production.run]
args = ["bash", "artifacts/api-server/replit-cptr-api.sh"]

[services.production.run.env]
PORT = "8080"

[services.production.health.startup]
path = "/api/health"
